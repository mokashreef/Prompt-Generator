<!DOCTYPE html>
<html lang="ar" dir="rtl" class="theme-dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Prompt Generator - Quick Popup</title>
  <link rel="stylesheet" href="./popup.css">
</head>
<body>

  <!-- Popup Header -->
  <header class="popup-header">
    <div class="popup-brand">
      <div class="popup-logo">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <polyline points="4 17 10 11 4 5"></polyline>
          <line x1="12" y1="19" x2="20" y2="19"></line>
        </svg>
      </div>
      <span class="popup-title">Prompt Generator</span>
    </div>

    <div class="popup-controls">
      <button id="pop-btn-open-sidepanel" class="popup-btn-icon" type="button" title="Open in Side Panel">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <rect width="18" height="18" x="3" y="3" rx="2" ry="2"></rect>
          <line x1="15" y1="3" x2="15" y2="21"></line>
        </svg>
      </button>
      <button id="pop-btn-lang" class="popup-btn-icon" type="button" title="Language">
        <span id="pop-lang-text">EN</span>
      </button>
    </div>
  </header>

  <!-- Input Section -->
  <main class="popup-body">
    <div class="popup-input-group">
      <textarea id="pop-input" class="popup-textarea" placeholder="الصق أو اكتب البرومبت هنا..." data-i18n-placeholder="originalPlaceholder" rows="3"></textarea>
    </div>

    <!-- Quick Actions Pills -->
    <div class="popup-actions-scroll" id="pop-actions-list">
      <!-- Action buttons -->
    </div>

    <!-- Generate & Clear Row -->
    <div class="popup-btn-row">
      <button id="pop-btn-improve" class="popup-btn popup-btn-primary" type="button">
        <span data-i18n="btnImprove">تحسين البرومبت</span>
      </button>
      <button id="pop-btn-clear" class="popup-btn popup-btn-secondary" type="button" data-i18n="btnClear">
        مسح
      </button>
    </div>

    <!-- Output Section (Reveals upon improvement) -->
    <div id="pop-output-section" class="popup-output-box" style="display: none;">
      <div class="popup-output-header">
        <span class="popup-label" data-i18n="improvedTitle">البرومبت المحسّن</span>
        <div class="popup-meta">
          <span id="pop-quality-badge" class="badge-quality">0%</span>
        </div>
      </div>
      <textarea id="pop-output" class="popup-textarea popup-textarea-output" rows="5"></textarea>

      <!-- Output Actions -->
      <div class="popup-toolbar">
        <button id="pop-btn-replace" class="popup-btn popup-btn-accent popup-btn-sm" type="button">
          <span data-i18n="btnReplace">استبدال في الصفحة</span>
        </button>
        <button id="pop-btn-copy" class="popup-btn popup-btn-primary popup-btn-sm" type="button">
          <span data-i18n="btnCopy">نسخ</span>
        </button>
      </div>
    </div>
  </main>

  <!-- Toast -->
  <div id="pop-toast" class="popup-toast"></div>

  <script type="module" src="./popup.js"></script>
</body>
</html>
